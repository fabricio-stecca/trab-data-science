experiment:
  seed: 42
  output_dir: resultados/runs
  results_file: resultados/resultados.csv
  name: knn__n_neighbors=5__weights=uniform
data:
  path: data/raw/german.data
  drop_features: []
  log_transform:
  - credit_amount
  - duration
  scaler: standard
  rare_category_min_frequency: 0.02
split:
  train: 0.6
  val: 0.2
  test: 0.2
  stratify: true
  seed: 42
evaluation:
  threshold: optimize_cost
  cost_fn: 5
  cost_fp: 1
  main_metric: cost_mean
model:
  n_neighbors: 5
  weights: uniform
  p: 2
